<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicemarket — Маркетплейс</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: var(--surface); border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 10; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #818cf8; text-decoration: none; }
    .nav-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

    .btn { padding: 0.6rem 1.2rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; color: white; }
    .btn-primary { background-color: var(--primary); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--surface-border); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .btn-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .btn-small { padding: 0.3rem 0.6rem; font-size: 0.75rem; border-radius: 6px; }

    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; width: 100%; }
    .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .card { background-color: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .card-img { width: 100%; height: 200px; object-fit: cover; background-color: #0b0f19; }
    .card-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; gap: 0.5rem; }
    .card-price { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .card-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; flex: 1; }
    .card-contacts { color: #818cf8; font-size: 0.85rem; font-weight: 500; margin-top: 0.5rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; border-top: 1px solid var(--surface-border); padding-top: 0.75rem; margin-top: 0.5rem; flex-wrap: wrap; gap: 0.5rem;}
    
    .pinned-badge { position: absolute; top: 10px; right: 10px; background: var(--warning); color: #000; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; visibility: hidden; opacity: 0; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); width: 100%; max-width: 500px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--surface-border); color: var(--text); }
    .hidden { display: none !important; }

    /* Таблица админки */
    .user-list { display: flex; flex-direction: column; gap: 10px; }
    .user-item { background: var(--bg); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--surface-border); }
    .user-email { font-size: 0.9rem; font-weight: 500; }
    .banned-text { color: var(--danger); font-size: 0.8rem; font-weight: bold; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">🛍 Nicemarket</a>
      <div class="nav-actions">
        <div id="authGuest"><button class="btn btn-secondary" onclick="openModal('authModal')">Войти</button></div>
        <div id="authUser" class="hidden">
          <span id="userEmailBadge" style="margin-right: 10px; font-size: 0.85rem;"></span>
          <button id="adminPanelBtn" class="btn btn-warning hidden" onclick="openAdminPanel()">Панель Админа</button>
          <button class="btn btn-primary" onclick="openPostModal()">+ Объявление</button>
          <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2 class="section-title">Все объявления</h2>
    <div id="itemsGrid" class="grid"><div style="color: gray;">Загрузка...</div></div>
  </main>

  <!-- Модалка Входа -->
  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authModalTitle">Вход</h3>
        <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
      </div>
      <form onsubmit="handleAuth(event)">
        <div class="form-group"><label>Email</label><input type="email" id="authEmail" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" required></div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%;">Войти</button>
      </form>
      <div style="margin-top: 1rem; text-align: center;">
        <a href="#" style="color: #818cf8;" onclick="toggleAuthMode(event)" id="authSwitchLink">Нет аккаунта? Зарегистрироваться</a>
      </div>
    </div>
  </div>

  <!-- Модалка Создания / Редактирования -->
  <div id="postModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="postModalTitle">Новое объявление</h3>
        <button class="close-btn" onclick="closeModal('postModal')">&times;</button>
      </div>
      <form onsubmit="handleSavePost(event)">
        <input type="hidden" id="editPostId">
        <div class="form-group"><label>Название товара</label><input type="text" id="postTitle" required></div>
        <div class="form-group"><label>Цена (₽)</label><input type="number" id="postPrice" required></div>
        <div class="form-group">
          <label>Фото (выберите новый файл или оставьте пустым)</label>
          <input type="file" id="postImageFile" accept="image/*">
          <input type="hidden" id="existingImage">
        </div>
        <div class="form-group"><label>Описание</label><textarea id="postDesc" rows="2" required></textarea></div>
        <div class="form-group"><label>Контакты</label><input type="text" id="postContacts" required placeholder="+7 999 000-00-00"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Панель Администратора -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Управление пользователями</h3>
        <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
      </div>
      <div id="adminUserList" class="user-list">
        <!-- Список пользователей подгружается сюда -->
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiW1GNyhjJiuEJapEP0Qx06_PrfbmEBTc",
      authDomain: "nicemarket-d77d0.firebaseapp.com",
      projectId: "nicemarket-d77d0",
      storageBucket: "nicemarket-d77d0.firebasestorage.app",
      messagingSenderId: "848367524440",
      appId: "1:848367524440:web:096d45aaf48a48f75c882d"
    };

    const ADMIN_EMAIL = "Nomer0084@gmail.com"; 

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let isRegisterMode = false;
    let isAdmin = false;

    // Авторизация и проверка на БАН
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        // Проверяем/создаем пользователя в базе
        const userRef = db.collection('users').doc(user.uid);
        const docSnap = await userRef.get();
        
        if (!docSnap.exists) {
          await userRef.set({ email: user.email, banned: false, role: 'user' });
        } else if (docSnap.data().banned) {
          alert("❌ ВАШ АККАУНТ ЗАБЛОКИРОВАН АДМИНИСТРАЦИЕЙ!");
          auth.signOut();
          return;
        }

        currentUser = user;
        isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        
        document.getElementById('authGuest').classList.add('hidden');
        document.getElementById('authUser').classList.remove('hidden');
        document.getElementById('userEmailBadge').textContent = user.email + (isAdmin ? ' (Админ)' : '');
        
        if(isAdmin) document.getElementById('adminPanelBtn').classList.remove('hidden');
      } else {
        currentUser = null;
        isAdmin = false;
        document.getElementById('authGuest').classList.remove('hidden');
        document.getElementById('authUser').classList.add('hidden');
        document.getElementById('adminPanelBtn').classList.add('hidden');
      }
      loadPosts(); 
    });

    async function handleAuth(e) {
      e.preventDefault();
      const em = document.getElementById('authEmail').value;
      const pw = document.getElementById('authPassword').value;
      try {
        let cred;
        if (isRegisterMode) cred = await auth.createUserWithEmailAndPassword(em, pw);
        else cred = await auth.signInWithEmailAndPassword(em, pw);
        
        // Записываем в базу принудительно при регистрации
        if(isRegisterMode) {
          await db.collection('users').doc(cred.user.uid).set({ email: em, banned: false, role: 'user' });
        }
        closeModal('authModal');
      } catch (err) { alert(err.message); }
    }

    function toggleAuthMode(e) {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      document.getElementById('authModalTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
      document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
      document.getElementById('authSwitchLink').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    function logoutUser() { auth.signOut(); }

    // Конвертация фото
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Открытие модалки создания (сброс полей)
    function openPostModal() {
      document.getElementById('editPostId').value = '';
      document.getElementById('postModalTitle').textContent = 'Новое объявление';
      document.getElementById('existingImage').value = '';
      document.querySelector('#postModal form').reset();
      openModal('postModal');
    }

    // Сохранение (Создание ИЛИ Редактирование)
    async function handleSavePost(e) {
      e.preventDefault();
      if (!currentUser) return;
      
      const fileInput = document.getElementById('postImageFile');
      let base64Img = document.getElementById('existingImage').value; // берем старое, если есть
      
      // Если загрузили новое фото - обновляем
      if(fileInput.files.length > 0) {
        base64Img = await getBase64(fileInput.files[0]);
      }

      if(!base64Img) { alert("Выберите фото!"); return; }

      const postData = {
        title: document.getElementById('postTitle').value,
        price: Number(document.getElementById('postPrice').value),
        image: base64Img,
        description: document.getElementById('postDesc').value,
        contacts: document.getElementById('postContacts').value
      };

      const editId = document.getElementById('editPostId').value;
      try {
        if(editId) {
          // Редактируем
          await db.collection('products').doc(editId).update(postData);
        } else {
          // Создаем новое
          postData.sellerEmail = currentUser.email;
          postData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          postData.pinned = false; // по умолчанию не закреплено
          await db.collection('products').add(postData);
        }
        closeModal('postModal');
      } catch (err) { alert(err.message); }
    }

    // Загрузка постов
    function loadPosts() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        const grid = document.getElementById('itemsGrid');
        grid.innerHTML = '';
        
        let posts = [];
        snapshot.forEach((doc) => posts.push({ id: doc.id, ...doc.data() }));
        
        // Сортируем: сначала закрепленные
        posts.sort((a, b) => (b.pinned === true) - (a.pinned === true));

        posts.forEach(item => {
          const isOwner = currentUser && currentUser.email === item.sellerEmail;
          
          let adminBtns = '';
          if(isAdmin || isOwner) {
            adminBtns += `<button class="btn btn-secondary btn-small" onclick="editPost('${item.id}', '${item.title}', ${item.price}, '${item.description.replace(/'/g, "\\'")}', '${item.contacts}', '${item.image}')">Ред.</button>`;
            adminBtns += `<button class="btn btn-danger btn-small" onclick="deletePost('${item.id}')">Удалить</button>`;
          }
          if(isAdmin) {
            const pinText = item.pinned ? 'Открепить' : '📌 Закрепить';
            adminBtns += `<button class="btn btn-warning btn-small" onclick="togglePin('${item.id}', ${item.pinned})">${pinText}</button>`;
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${item.pinned ? '<div class="pinned-badge">📌 ТОП</div>' : ''}
            <img class="card-img" src="${item.image}" alt="Фото">
            <div class="card-body">
              <div class="card-price">${item.price} ₽</div>
              <div class="card-title">${item.title}</div>
              <div class="card-desc">${item.description}</div>
              <div class="card-contacts">📞 ${item.contacts || 'Нет данных'}</div>
              <div class="card-footer" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                <span>👤 ${item.sellerEmail}</span>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">${adminBtns}</div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      });
    }

    // Действия с постами
    async function deletePost(id) {
      if(confirm('Точно удалить?')) await db.collection('products').doc(id).delete();
    }
    
    async function togglePin(id, currentStatus) {
      await db.collection('products').doc(id).update({ pinned: !currentStatus });
    }

    function editPost(id, title, price, desc, contacts, imgUrl) {
      document.getElementById('postModalTitle').textContent = 'Редактировать объявление';
      document.getElementById('editPostId').value = id;
      document.getElementById('postTitle').value = title;
      document.getElementById('postPrice').value = price;
      document.getElementById('postDesc').value = desc;
      document.getElementById('postContacts').value = contacts;
      document.getElementById('existingImage').value = imgUrl; // сохраняем старое фото
      openModal('postModal');
    }

    // ПАНЕЛЬ АДМИНИСТРАТОРА
    function openAdminPanel() {
      if(!isAdmin) return;
      openModal('adminModal');
      const list = document.getElementById('adminUserList');
      list.innerHTML = 'Загрузка...';

      db.collection('users').onSnapshot(snapshot => {
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const u = doc.data();
          const isMe = u.email === ADMIN_EMAIL;
          
          let actionBtn = '';
          if(!isMe) {
            actionBtn = u.banned 
              ? `<button class="btn btn-secondary btn-small" onclick="toggleBan('${doc.id}', false)">Разбанить</button>`
              : `<button class="btn btn-danger btn-small" onclick="toggleBan('${doc.id}', true)">Забанить</button>`;
          }

          list.innerHTML += `
            <div class="user-item">
              <div>
                <div class="user-email">${u.email} ${isMe ? '⭐' : ''}</div>
                ${u.banned ? '<div class="banned-text">Заблокирован</div>' : ''}
              </div>
              <div>${actionBtn}</div>
            </div>
          `;
        });
      });
    }

    async function toggleBan(uid, banStatus) {
      if(confirm(banStatus ? 'Точно забанить пользователя?' : 'Разбанить пользователя?')) {
        await db.collection('users').doc(uid).update({ banned: banStatus });
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
