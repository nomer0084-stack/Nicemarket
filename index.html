<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicemarket — Маркетплейс</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: var(--surface); border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 10; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #818cf8; text-decoration: none; }
    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    .btn { padding: 0.6rem 1.2rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: transparent; color: var(--text); border: 1px solid var(--surface-border); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .btn-danger:hover { background-color: rgba(239, 68, 68, 0.25); }

    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; width: 100%; }
    .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .card { background-color: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 200px; object-fit: cover; background-color: #0b0f19; }
    .card-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; gap: 0.5rem; }
    .card-price { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .card-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; flex: 1; }
    .card-contacts { color: #818cf8; font-size: 0.85rem; font-weight: 500; margin-top: 0.5rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; border-top: 1px solid var(--surface-border); padding-top: 0.75rem; margin-top: 0.5rem; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; visibility: hidden; opacity: 0; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); width: 100%; max-width: 480px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--surface-border); color: var(--text); }
    .hidden { display: none !important; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">🛍️️ Nicemarket</a>
      <div class="nav-actions">
        <div id="authGuest"><button class="btn btn-secondary" onclick="openModal('authModal')">Войти</button></div>
        <div id="authUser" class="hidden">
          <span id="userEmailBadge" style="margin-right: 10px; font-size: 0.85rem;"></span>
          <button class="btn btn-primary" onclick="openModal('createPostModal')">+ Объявление</button>
          <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2 class="section-title">Все объявления</h2>
    <div id="itemsGrid" class="grid"><div style="color: gray;">Загрузка...</div></div>
  </main>

  <!-- Модалка Входа -->
  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authModalTitle">Вход</h3>
        <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
      </div>
      <form onsubmit="handleAuth(event)">
        <div class="form-group"><label>Email</label><input type="email" id="authEmail" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" required></div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%;">Войти</button>
      </form>
      <div style="margin-top: 1rem; text-align: center;">
        <a href="#" style="color: #818cf8;" onclick="toggleAuthMode(event)" id="authSwitchLink">Нет аккаунта? Зарегистрироваться</a>
      </div>
    </div>
  </div>

  <!-- Модалка Создания (с загрузкой файла и контактами) -->
  <div id="createPostModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Новое объявление</h3>
        <button class="close-btn" onclick="closeModal('createPostModal')">&times;</button>
      </div>
      <form onsubmit="handleCreatePost(event)">
        <div class="form-group"><label>Название товара</label><input type="text" id="postTitle" required></div>
        <div class="form-group"><label>Цена (₽)</label><input type="number" id="postPrice" required></div>
        <div class="form-group"><label>Фото (выберите файл)</label><input type="file" id="postImageFile" accept="image/*" required></div>
        <div class="form-group"><label>Описание</label><textarea id="postDesc" rows="2" required></textarea></div>
        <div class="form-group"><label>Контакты (Телефон, Telegram, WhatsApp)</label><input type="text" id="postContacts" required placeholder="Например: +7 999 000-00-00"></div>
        <button type="submit" id="postSubmitBtn" class="btn btn-primary" style="width: 100%;">Опубликовать</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiW1GNyhjJiuEJapEP0Qx06_PrfbmEBTc",
      authDomain: "nicemarket-d77d0.firebaseapp.com",
      projectId: "nicemarket-d77d0",
      storageBucket: "nicemarket-d77d0.firebasestorage.app",
      messagingSenderId: "848367524440",
      appId: "1:848367524440:web:096d45aaf48a48f75c882d"
    };

    // Почта администратора
    const ADMIN_EMAIL = "Nomer0084@gmail.com"; 

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let isRegisterMode = false;

    // Авторизация
    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        document.getElementById('authGuest').classList.add('hidden');
        document.getElementById('authUser').classList.remove('hidden');
        // Приведение почты к нижнему регистру для точного совпадения
        let badgeText = user.email;
        if(user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) badgeText += ' (Админ)';
        document.getElementById('userEmailBadge').textContent = badgeText;
      } else {
        document.getElementById('authGuest').classList.remove('hidden');
        document.getElementById('authUser').classList.add('hidden');
      }
      loadPosts(); 
    });

    async function handleAuth(e) {
      e.preventDefault();
      const em = document.getElementById('authEmail').value;
      const pw = document.getElementById('authPassword').value;
      try {
        if (isRegisterMode) await auth.createUserWithEmailAndPassword(em, pw);
        else await auth.signInWithEmailAndPassword(em, pw);
        closeModal('authModal');
      } catch (err) { alert(err.message); }
    }

    function toggleAuthMode(e) {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      document.getElementById('authModalTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
      document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
      document.getElementById('authSwitchLink').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    function logoutUser() { auth.signOut(); }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      if (!currentUser) return;
      
      const fileInput = document.getElementById('postImageFile');
      let base64Img = '';
      if(fileInput.files.length > 0) {
        base64Img = await getBase64(fileInput.files[0]);
      }

      try {
        await db.collection('products').add({
          title: document.getElementById('postTitle').value,
          price: Number(document.getElementById('postPrice').value),
          image: base64Img,
          description: document.getElementById('postDesc').value,
          contacts: document.getElementById('postContacts').value,
          sellerEmail: currentUser.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('createPostModal').querySelector('form').reset();
        closeModal('createPostModal');
      } catch (err) { alert(err.message); }
    }

    async function deletePost(id) {
      if(confirm('Точно удалить объявление?')) {
        await db.collection('products').doc(id).delete();
      }
    }

    function loadPosts() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        const grid = document.getElementById('itemsGrid');
        grid.innerHTML = '';
        snapshot.forEach((doc) => {
          const item = doc.data();
          const id = doc.id;
          
          const isAdmin = currentUser && currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
          const isOwner = currentUser && currentUser.email === item.sellerEmail;
          const showDeleteBtn = isAdmin || isOwner;
          
          const contactsText = item.contacts ? `📞 Контакты: ${item.contacts}` : '';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img class="card-img" src="${item.image}" alt="Фото">
            <div class="card-body">
              <div class="card-price">${item.price} ₽</div>
              <div class="card-title">${item.title}</div>
              <div class="card-desc">${item.description}</div>
              <div class="card-contacts">${contactsText}</div>
              <div class="card-footer">
                <span>👤 ${item.sellerEmail.split('@')[0]}</span>
                ${showDeleteBtn ? `<button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.75rem;" onclick="deletePost('${id}')">Удалить</button>` : ''}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
