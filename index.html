<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f9ff">
    <title>Молодёжный Маркет</title>
    
    <!-- Ссылка на манифест будет сгенерирована динамически в JS -->
    <link id="manifest-link" rel="manifest" href="">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0f2fe; /* Фон за пределами телефона на ПК */
            color: #0f172a;
            /* Нативные свойства приложения */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Контейнер-эмулятор телефона для ПК */
        #app-container {
            width: 100%;
            height: 100dvh;
            background-color: #f0f9ff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            #app-container {
                max-width: 414px; /* iPhone Max width */
                height: 850px;
                max-height: 90vh;
                border-radius: 40px;
                box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.25);
                border: 8px solid #ffffff;
            }
        }

        /* Скрываем скроллбары для красоты */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Анимации видов */
        .view-section {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: calc(80px + var(--sab));
            padding-top: var(--sat);
            animation: fadeSlideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        .view-section.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Навигация (Bottom Bar) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(224, 242, 254, 0.8);
            padding-bottom: var(--sab);
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 0;
            color: #94a3b8;
            transition: all 0.3s ease;
        }
        
        .nav-item.active {
            color: #0ea5e9;
        }
        
        .nav-item.active i {
            transform: translateY(-2px);
            filter: drop-shadow(0 4px 6px rgba(14, 165, 233, 0.3));
        }

        .nav-item i {
            font-size: 1.25rem;
            margin-bottom: 4px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item span {
            font-size: 0.65rem;
            font-weight: 600;
        }

        /* Карточки и ТОП */
        .item-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px -5px rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(224, 242, 254, 0.6);
            transform: translateZ(0); /* Аппаратное ускорение */
        }
        
        .promoted-card {
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
        }
        
        .promoted-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(45deg, #38bdf8, #c084fc, #38bdf8);
            background-size: 200% 200%;
            animation: shimmer 3s linear infinite;
            z-index: -1;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Уведомления */
        #toast-container {
            position: absolute;
            bottom: calc(90px + var(--sab));
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            pointer-events: none;
        }
        .toast {
            background: rgba(15, 23, 42, 0.9);
            color: white;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUpFade 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.closing { opacity: 0; transform: translateY(10px); transition: all 0.3s; }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 340px;
            border-radius: 28px;
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* Лоадер */
        .loader {
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Header (App Bar) -->
        <header class="pt-[calc(10px+var(--sat))] pb-3 px-6 bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-sky-100 flex justify-between items-center">
            <h1 class="font-bold text-xl text-slate-800 tracking-tight">Маркет<span class="text-sky-500">Плейс</span></h1>
            <div id="user-avatar" class="w-9 h-9 rounded-full bg-sky-100 text-sky-500 flex items-center justify-center text-sm font-bold shadow-sm" onclick="handleAuthClick()">
                <i class="fa-solid fa-user"></i>
            </div>
        </header>

        <!-- Вкладка: Каталог -->
        <main id="view-browse" class="view-section active px-4 pt-4">
            <!-- Приветственный баннер -->
            <div class="bg-gradient-to-br from-sky-400 to-blue-500 rounded-3xl p-6 mb-6 text-white shadow-lg shadow-sky-200/50 relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold mb-1">Найди свой стиль</h2>
                    <p class="text-sky-100 text-sm mb-4">Покупай и продавай легко!</p>
                    <button onclick="switchView('add')" class="bg-white/20 backdrop-blur-md border border-white/30 text-white text-sm font-semibold py-2 px-4 rounded-xl active:scale-95 transition-transform">
                        Разместить товар
                    </button>
                </div>
                <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-white opacity-20 blur-xl"></div>
            </div>

            <div class="flex justify-between items-center mb-4 px-1">
                <h3 class="text-lg font-bold text-slate-800">Свежее</h3>
                <span class="text-xs font-semibold bg-sky-100 text-sky-600 px-2 py-1 rounded-lg" id="items-count-badge">0</span>
            </div>
            
            <div id="items-grid" class="grid grid-cols-2 gap-4 pb-4">
                <!-- Карточки будут здесь -->
            </div>
            
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <div class="w-20 h-20 bg-sky-100 rounded-full flex items-center justify-center mb-4 text-sky-400">
                    <i class="fa-solid fa-box-open text-3xl"></i>
                </div>
                <h3 class="font-semibold text-slate-700">Пусто</h3>
                <p class="text-slate-400 text-sm mt-1">Станьте первым!</p>
            </div>
        </main>

        <!-- Вкладка: Продать -->
        <main id="view-add" class="view-section px-4 pt-4">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 px-1">Новое объявление</h2>
            
            <form id="add-item-form" class="space-y-5 bg-white p-5 rounded-3xl shadow-sm border border-sky-50">
                <!-- Загрузка фото -->
                <div>
                    <div class="flex justify-center items-center w-full h-40 bg-sky-50 rounded-2xl border-2 border-dashed border-sky-200 relative overflow-hidden active:bg-sky-100 transition-colors">
                        <div class="text-center" id="upload-prompt">
                            <i class="fa-solid fa-camera text-3xl text-sky-400 mb-2"></i>
                            <span class="block text-sm font-medium text-sky-600">Добавить фото</span>
                        </div>
                        <input id="item-image-file" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        
                        <div id="image-preview-container" class="hidden absolute inset-0 bg-white">
                            <img id="image-preview" src="" class="w-full h-full object-cover">
                            <button type="button" id="remove-image-btn" class="absolute top-2 right-2 bg-slate-900/50 backdrop-blur-md text-white rounded-full w-8 h-8 flex items-center justify-center active:scale-95 z-10">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Название</label>
                    <input type="text" id="item-title" placeholder="Что продаете?" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:border-sky-400 focus:bg-white outline-none transition-all text-sm font-medium">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Цена (₽)</label>
                    <input type="number" id="item-price" pattern="[0-9]*" placeholder="0" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:border-sky-400 focus:bg-white outline-none transition-all text-sm font-medium font-mono">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Описание</label>
                    <textarea id="item-desc" rows="3" placeholder="Состояние, размер..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:border-sky-400 focus:bg-white outline-none transition-all text-sm font-medium resize-none"></textarea>
                </div>
                
                <button type="button" id="submit-item-btn" class="w-full py-3.5 bg-gradient-to-r from-sky-400 to-sky-500 text-white font-bold rounded-xl active:scale-95 transition-transform flex justify-center items-center shadow-lg shadow-sky-200/50">
                    Опубликовать
                </button>
            </form>
        </main>

        <!-- Вкладка: Управление (Админ) -->
        <main id="view-admin" class="view-section px-4 pt-4">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 px-1">Управление</h2>
            
            <div class="bg-white rounded-3xl shadow-sm border border-sky-50 overflow-hidden">
                <div id="admin-list" class="divide-y divide-slate-50">
                    <!-- Список для админа -->
                </div>
                <div id="admin-empty-state" class="hidden py-10 text-center">
                    <p class="text-slate-400 text-sm font-medium">Нет активных объявлений</p>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav pb-[var(--sab)] shadow-[0_-10px_20px_rgba(0,0,0,0.03)]">
            <button class="nav-item active" data-target="browse" onclick="switchView('browse')">
                <i class="fa-solid fa-layer-group"></i>
                <span>Каталог</span>
            </button>
            <button class="nav-item" data-target="add" onclick="switchView('add')">
                <div class="w-12 h-12 bg-sky-500 rounded-full flex items-center justify-center text-white shadow-lg shadow-sky-200/50 -mt-5 mb-1 active:scale-95 transition-transform border-4 border-white">
                    <i class="fa-solid fa-plus m-0 text-xl filter-none"></i>
                </div>
                <span>Продать</span>
            </button>
            <button class="nav-item" data-target="admin" onclick="switchView('admin')">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Управление</span>
            </button>
        </nav>

        <!-- Toasts -->
        <div id="toast-container"></div>

        <!-- Auth Modal -->
        <div id="auth-modal" class="modal-overlay">
            <div class="modal-content relative p-6">
                <button onclick="closeModal('auth-modal')" class="absolute top-4 right-4 w-8 h-8 flex justify-center items-center bg-slate-50 rounded-full text-slate-400 active:bg-slate-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-sky-100 text-sky-500 rounded-full mx-auto flex items-center justify-center text-2xl mb-3"><i class="fa-solid fa-envelope"></i></div>
                    <h3 class="text-xl font-bold text-slate-800" id="auth-title">Вход</h3>
                    <p class="text-sm text-slate-500">Войдите, чтобы продавать</p>
                </div>
                <form id="auth-form" class="space-y-4">
                    <input type="email" id="auth-email" placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:border-sky-400 outline-none text-sm">
                    <input type="password" id="auth-password" placeholder="Пароль" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:border-sky-400 outline-none text-sm">
                    <button type="button" id="auth-submit-btn" class="w-full py-3 bg-sky-500 text-white font-bold rounded-xl active:scale-95 flex justify-center items-center">Войти / Создать</button>
                </form>
            </div>
        </div>

        <!-- Admin Auth Modal -->
        <div id="admin-auth-modal" class="modal-overlay">
            <div class="modal-content relative p-6 text-center">
                <button onclick="closeModal('admin-auth-modal')" class="absolute top-4 right-4 w-8 h-8 bg-slate-50 rounded-full text-slate-400">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="w-14 h-14 bg-slate-100 text-slate-500 rounded-full mx-auto flex items-center justify-center text-2xl mb-3"><i class="fa-solid fa-lock"></i></div>
                <h3 class="text-xl font-bold text-slate-800 mb-4">Доступ закрыт</h3>
                <input type="password" id="admin-password" placeholder="Пароль" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 outline-none mb-4 text-center tracking-widest text-lg">
                <button type="button" id="admin-login-btn" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl active:scale-95">Разблокировать</button>
            </div>
        </div>

        <!-- Promo Modal -->
        <div id="promo-modal" class="modal-overlay">
            <div class="modal-content overflow-hidden">
                <div class="bg-gradient-to-r from-fuchsia-500 to-sky-500 p-6 text-white text-center pt-8">
                    <i class="fa-solid fa-rocket text-5xl mb-4 drop-shadow-md"></i>
                    <h3 class="text-2xl font-bold">Опубликовано!</h3>
                </div>
                <div class="p-6 text-center bg-white">
                    <p class="text-slate-500 mb-6 text-sm">Сделайте товар заметнее! <br>Продвижение в <b>ТОП</b> стоит всего 10 ₽.</p>
                    <button onclick="acceptPromo()" class="w-full py-3.5 bg-sky-500 text-white font-bold rounded-xl mb-3 shadow-lg shadow-sky-200/50 active:scale-95">Продвинуть за 10 ₽</button>
                    <button onclick="closeModal('promo-modal'); switchView('browse')" class="w-full py-3 bg-slate-50 text-slate-500 font-semibold rounded-xl active:bg-slate-100">Позже</button>
                </div>
            </div>
        </div>

        <!-- Payment Modal -->
        <div id="payment-modal" class="modal-overlay">
            <div class="modal-content p-6">
                <h3 class="text-xl font-bold text-center mb-6 text-slate-800">Оплата</h3>
                <div class="space-y-4">
                    <input type="tel" placeholder="0000 0000 0000 0000" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 font-mono text-sm outline-none">
                    <div class="flex gap-4">
                        <input type="tel" placeholder="ММ/ГГ" class="w-1/2 px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 font-mono text-sm outline-none text-center">
                        <input type="tel" placeholder="CVC" class="w-1/2 px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 font-mono text-sm outline-none text-center" style="-webkit-text-security: disc;">
                    </div>
                    <button type="button" id="pay-btn" class="w-full mt-2 py-3.5 bg-emerald-500 text-white font-bold rounded-xl active:scale-95 shadow-lg shadow-emerald-200/50 flex justify-center items-center">Оплатить 10 ₽</button>
                </div>
            </div>
        </div>

    </div> <!-- End App Container -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // PWA Setup (Manifest & Service Worker Inline)
        // ==========================================
        const svgLogo = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0ea5e9"/><path d="M156 200h200v200H156z" fill="#fff" opacity="0.2"/><path d="M256 120c-35 0-64 29-64 64h128c0-35-29-64-64-64z" fill="#fff"/><rect x="136" y="184" width="240" height="208" rx="24" fill="#fff"/><circle cx="256" cy="280" r="32" fill="#0ea5e9"/></svg>`;
        const encodedIcon = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgLogo)));
        
        // Add Apple Touch Icon
        const appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; appleIcon.href = encodedIcon; document.head.appendChild(appleIcon);
        
        // Create Manifest
        const manifestStr = JSON.stringify({
            name: "Молодёжный Маркетплейс", short_name: "Маркет", start_url: ".", display: "standalone",
            background_color: "#f0f9ff", theme_color: "#ffffff",
            icons: [{ src: encodedIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        });
        document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([manifestStr], {type: 'application/json'}));

        // Register Service Worker
        const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim()); self.addEventListener('fetch', e => {});`;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type: 'application/javascript'}))).catch(()=>{});
        }

        // ==========================================
        // App State & Firebase Setup
        // ==========================================
        const state = {
            user: null, items: [], isAdminAuth: false, isAuth: false, pendingId: null
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mobile-pwa-market';
        const fallbackConfig = { projectId: "demo-project", appId: "demo-app" };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackConfig;
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const itemsRef = collection(db, 'artifacts', appId, 'public', 'data', 'market_items');

        // UI Helpers
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = `toast ${type}`;
            const icon = type === 'success' ? '<i class="fa-solid fa-check-circle text-emerald-400"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-400"></i>';
            toast.innerHTML = `${icon} <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('closing'); setTimeout(() => toast.remove(), 300); }, 2500);
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        const openModal = (id) => document.getElementById(id).classList.add('active');

        // Navigation
        window.switchView = (viewId) => {
            if (viewId === 'admin' && !state.isAdminAuth) { openModal('admin-auth-modal'); return; }
            if (viewId === 'add' && !state.isAuth) { openModal('auth-modal'); showToast("Сначала войдите", "error"); return; }
            
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => {
                if(el.dataset.target === viewId) el.classList.add('active');
                else el.classList.remove('active');
            });
            
            if (viewId === 'browse') renderBrowse();
            if (viewId === 'admin') renderAdmin();
        };

        // Auth Flow
        window.handleAuthClick = () => {
            if (state.isAuth) {
                if(confirm("Выйти из аккаунта?")) {
                    signOut(auth); state.isAuth = false; switchView('browse'); showToast("Вы вышли");
                }
            } else openModal('auth-modal');
        };

        document.getElementById('auth-submit-btn').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value, pwd = document.getElementById('auth-password').value;
            if(!email || !pwd) return showToast("Заполните данные", "error");
            
            const btn = document.getElementById('auth-submit-btn'); const orig = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true;
            
            try {
                // Пытаемся войти, если нет - создаем
                try { await signInWithEmailAndPassword(auth, email, pwd); } 
                catch(e) { 
                    if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
                        await createUserWithEmailAndPassword(auth, email, pwd);
                    } else throw e;
                }
                closeModal('auth-modal'); showToast("Успешный вход");
                if(!state.isAuth && state.pendingView === 'add') switchView('add'); // go to add if they were blocked
            } catch(e) { 
                showToast("Ошибка входа: " + (e.code === 'auth/weak-password' ? 'слабый пароль' : 'неверные данные'), "error"); 
            } finally { 
                btn.innerHTML = orig; btn.disabled = false; 
            }
        });

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user && !user.isAnonymous && user.email) {
                state.isAuth = true;
                document.getElementById('user-avatar').innerHTML = user.email.substring(0,2).toUpperCase();
                document.getElementById('user-avatar').classList.replace('bg-sky-100', 'bg-sky-500');
                document.getElementById('user-avatar').classList.replace('text-sky-500', 'text-white');
            } else {
                state.isAuth = false;
                document.getElementById('user-avatar').innerHTML = '<i class="fa-solid fa-user"></i>';
                document.getElementById('user-avatar').classList.replace('bg-sky-500', 'bg-sky-100');
                document.getElementById('user-avatar').classList.replace('text-white', 'text-sky-500');
            }
            
            onSnapshot(itemsRef, (snap) => {
                state.items = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => {
                    if (a.isPromoted && !b.isPromoted) return -1;
                    if (!a.isPromoted && b.isPromoted) return 1;
                    return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0);
                });
                renderBrowse(); if(document.getElementById('view-admin').classList.contains('active')) renderAdmin();
            }, (err) => console.log(err));
        });

        // Admin Login
        document.getElementById('admin-login-btn').addEventListener('click', () => {
            if (document.getElementById('admin-password').value === 'Corola20') {
                state.isAdminAuth = true; closeModal('admin-auth-modal'); switchView('admin');
                document.getElementById('admin-password').value = '';
            } else showToast("Неверный пароль", "error");
        });

        // Image Handling
        const fileInput = document.getElementById('item-image-file');
        const imgCont = document.getElementById('image-preview-container');
        const imgPrev = document.getElementById('image-preview');

        fileInput.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) {
                const r = new FileReader();
                r.onload = ev => { imgPrev.src = ev.target.result; imgCont.classList.remove('hidden'); };
                r.readAsDataURL(f);
            }
        });
        document.getElementById('remove-image-btn').addEventListener('click', (e) => {
            e.stopPropagation(); fileInput.value = ''; imgCont.classList.add('hidden'); imgPrev.src = '';
        });

        function compressImage(file, max = 800) {
            return new Promise((res) => {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = ev => {
                    const img = new Image(); img.src = ev.target.result;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > max || h > max) { if (w > h) { h = Math.round(h*max/w); w = max; } else { w = Math.round(w*max/h); h = max; } }
                        const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
                        cvs.getContext('2d').drawImage(img, 0, 0, w, h);
                        res(cvs.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        }

        // Post Item
        document.getElementById('submit-item-btn').addEventListener('click', async () => {
            const t = document.getElementById('item-title').value, p = document.getElementById('item-price').value, d = document.getElementById('item-desc').value;
            const f = fileInput.files[0];
            if(!t || !p || !d) return showToast("Заполните все поля", "error");

            const btn = document.getElementById('submit-item-btn'); const orig = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true;

            try {
                let imgUrl = f ? await compressImage(f) : `https://placehold.co/400x400/e0f2fe/0ea5e9?text=${encodeURIComponent(t.substring(0,6))}`;
                const ref = await addDoc(itemsRef, {
                    title: t, price: parseFloat(p), description: d, imageUrl: imgUrl,
                    sellerEmail: state.user?.email || 'Скрыто', isPromoted: false, createdAt: serverTimestamp()
                });
                
                document.getElementById('add-item-form').reset();
                document.getElementById('remove-image-btn').click();
                
                state.pendingId = ref.id;
                openModal('promo-modal');
            } catch(e) { showToast("Ошибка", "error"); } 
            finally { btn.innerHTML = orig; btn.disabled = false; }
        });

        // Rendering
        function renderBrowse() {
            document.getElementById('items-count-badge').textContent = state.items.length;
            const grid = document.getElementById('items-grid');
            if(!state.items.length) { grid.innerHTML = ''; document.getElementById('empty-state').classList.remove('hidden'); document.getElementById('empty-state').classList.add('flex'); return; }
            document.getElementById('empty-state').classList.add('hidden'); document.getElementById('empty-state').classList.remove('flex');
            
            grid.innerHTML = state.items.map(it => `
                <div class="item-card flex flex-col ${it.isPromoted ? 'promoted-card' : ''}">
                    <div class="relative aspect-square bg-slate-50">
                        ${it.isPromoted ? '<div class="absolute top-2 left-2 bg-sky-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 shadow-md">ТОП</div>' : ''}
                        <img src="${it.imageUrl}" class="w-full h-full object-cover" loading="lazy">
                    </div>
                    <div class="p-3 flex flex-col flex-grow">
                        <div class="font-bold text-sky-500 text-sm mb-1">${it.price} ₽</div>
                        <div class="font-semibold text-slate-800 text-xs line-clamp-2 leading-tight mb-2 flex-grow">${it.title}</div>
                        <div class="text-[10px] text-slate-400 truncate mt-auto"><i class="fa-solid fa-envelope mr-1 opacity-50"></i>${it.sellerEmail.split('@')[0]}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderAdmin() {
            const list = document.getElementById('admin-list');
            if(!state.items.length) { list.innerHTML = ''; document.getElementById('admin-empty-state').classList.remove('hidden'); return; }
            document.getElementById('admin-empty-state').classList.add('hidden');
            
            list.innerHTML = state.items.map(it => `
                <div class="p-4 flex items-center justify-between gap-3 bg-white">
                    <img src="${it.imageUrl}" class="w-12 h-12 rounded-xl object-cover bg-slate-50 flex-shrink-0">
                    <div class="flex-grow min-w-0">
                        <h4 class="font-semibold text-sm text-slate-800 truncate">${it.title}</h4>
                        <div class="text-sky-500 text-xs font-bold">${it.price} ₽ ${it.isPromoted ? '<span class="ml-1 text-fuchsia-500">(ТОП)</span>' : ''}</div>
                    </div>
                    <button onclick="deleteItem('${it.id}')" class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex justify-center items-center active:bg-red-100 flex-shrink-0">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        // Actions
        window.deleteItem = async (id) => {
            if(confirm("Удалить объявление?")) {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'market_items', id)); showToast("Удалено"); } 
                catch(e) { showToast("Ошибка", "error"); }
            }
        };

        window.acceptPromo = () => { closeModal('promo-modal'); openModal('payment-modal'); };
        
        document.getElementById('pay-btn').addEventListener('click', async () => {
            const btn = document.getElementById('pay-btn'); const orig = btn.innerHTML;
            btn.innerHTML = '<div class="loader border-t-white"></div>'; btn.disabled = true;
            try {
                await new Promise(r => setTimeout(r, 1000));
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'market_items', state.pendingId), { isPromoted: true });
                showToast("Товар в ТОПе!"); closeModal('payment-modal'); switchView('browse');
            } catch(e) { showToast("Сбой", "error"); } 
            finally { btn.innerHTML = orig; btn.disabled = false; }
        });

        // Initialization auth logic
        const initToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        if(initToken && !auth.currentUser) signInWithCustomToken(auth, initToken).catch(()=>{});
        else if(!auth.currentUser) signInAnonymously(auth).catch(()=>{});

    </script>
</body>
</html>
